<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Link previews. These are in the static HTML because chat apps and social sites read the page
         without running JavaScript, so tags added by the app at runtime never reach them. -->
    <meta name="description" content="OwlSet is an Android app, in development, that helps freelancers turn client conversations into a confirmed scope, compare new requests with it, and prepare change proposals." />
    <meta name="theme-color" content="#0B1214" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OwlSet" />
    <meta property="og:url" content="https://owlsetph.vercel.app/" />
    <meta property="og:title" content="OwlSet: clear agreements for freelancers" />
    <meta property="og:description" content="Turn client conversations into a confirmed scope, check new requests against it, and draft change proposals." />
    <meta property="og:image" content="https://owlsetph.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OwlSet logo and Kwagi the owl, with the line: Clear agreements. Controlled revisions. Confident freelancing." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OwlSet: clear agreements for freelancers" />
    <meta name="twitter:description" content="Turn client conversations into a confirmed scope, check new requests against it, and draft change proposals." />
    <meta name="twitter:image" content="https://owlsetph.vercel.app/og.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
